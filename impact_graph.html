<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>N3MO Impact Tracker</title>
  <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d1117;
      --sidebar: #161b22;
      --card-bg: #0d1117;
      --border: #30363d;
      --border-subtle: #21262d;
      --text-main: #e6edf3;
      --text-dim: #8b949e;
      --text-muted: #6e7681;
      --accent: #2f81f7;
      --accent-hover: #58a6ff;
      --danger: #f85149;
      --warning: #d29922;
      --success: #3fb950;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { 
      width: 100%; height: 100%; 
      background: var(--bg); 
      color: var(--text-main);
      font-family: 'Inter', sans-serif; 
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Layout */
    #app { display: flex; width: 100vw; height: 100vh; }
    
    #graph-container { 
      flex: 1; 
      position: relative; 
      background: var(--bg);
    }
    
    #sidebar { 
      width: 360px; 
      background: var(--sidebar); 
      border-left: 1px solid var(--border); 
      display: flex; 
      flex-direction: column; 
      overflow-y: auto;
      box-shadow: -4px 0 24px rgba(0,0,0,0.3);
    }

    /* Header */
    .header { 
      padding: 24px 20px 20px;
      border-bottom: 1px solid var(--border-subtle);
      background: linear-gradient(180deg, var(--sidebar) 0%, rgba(13,17,23,0.4) 100%);
    }
    
    .logo { 
      font-family: 'JetBrains Mono'; 
      font-weight: 600; 
      font-size: 11px; 
      color: var(--accent); 
      letter-spacing: 2px; 
      margin-bottom: 8px;
      opacity: 0.9;
    }
    
    .target-box { 
      font-size: 18px; 
      font-weight: 600; 
      color: #fff;
      font-family: 'JetBrains Mono';
      word-break: break-all;
      line-height: 1.4;
    }

    /* Stats */
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 20px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .stat {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      transition: border-color 0.2s;
    }

    .stat:hover {
      border-color: var(--border);
    }

    .stat-label {
      font-size: 10px;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      font-weight: 500;
    }

    .stat-value {
      font-family: 'JetBrains Mono';
      font-size: 24px;
      font-weight: 600;
      line-height: 1;
    }

    .stat.direct .stat-value { color: var(--warning); }
    .stat.ripple .stat-value { color: var(--accent); }

    /* Inspector */
    .inspector {
      padding: 20px;
      flex: 1;
    }

    .card { 
      background: var(--card-bg); 
      border: 1px solid var(--border); 
      border-radius: 8px; 
      padding: 16px; 
      margin-bottom: 16px;
      transition: all 0.2s;
    }

    .card:hover {
      border-color: var(--border);
    }

    .card-label { 
      font-size: 10px; 
      text-transform: uppercase; 
      color: var(--text-muted); 
      margin-bottom: 10px; 
      letter-spacing: 0.5px;
      font-weight: 500;
    }

    .card-value { 
      font-family: 'JetBrains Mono'; 
      font-size: 13px; 
      word-break: break-all;
      line-height: 1.5;
      color: var(--text-main);
    }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .badge.target { background: rgba(248,81,73,0.15); color: var(--danger); border: 1px solid rgba(248,81,73,0.3); }
    .badge.direct { background: rgba(210,153,34,0.15); color: var(--warning); border: 1px solid rgba(210,153,34,0.3); }
    .badge.ripple { background: rgba(47,129,247,0.15); color: var(--accent); border: 1px solid rgba(47,129,247,0.3); }

    /* Code Preview */
    .code-preview {
      background: var(--bg);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      overflow: hidden;
      margin-top: 10px;
    }

    .code-header {
      background: rgba(22,27,34,0.6);
      padding: 8px 12px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .code-file {
      font-family: 'JetBrains Mono';
      font-size: 11px;
      color: var(--text-dim);
    }

    .code-line-badge {
      font-family: 'JetBrains Mono';
      font-size: 10px;
      color: var(--text-muted);
      background: var(--bg);
      padding: 2px 6px;
      border-radius: 3px;
    }

    .code-content {
      padding: 12px;
      font-family: 'JetBrains Mono';
      font-size: 12px;
      line-height: 1.6;
      overflow-x: auto;
    }

    .code-line {
      display: flex;
      gap: 12px;
      padding: 2px 0;
    }

    .code-line.highlight {
      background: rgba(210,153,34,0.1);
      margin: 0 -12px;
      padding: 2px 12px;
      border-left: 2px solid var(--warning);
    }

    .line-num {
      color: var(--text-muted);
      text-align: right;
      min-width: 30px;
      user-select: none;
      opacity: 0.6;
    }

    .line-code {
      color: var(--text-dim);
      white-space: pre;
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
    }

    .empty-state svg {
      width: 48px;
      height: 48px;
      opacity: 0.3;
      margin-bottom: 12px;
    }

    .empty-text {
      font-size: 13px;
      line-height: 1.6;
    }

    /* Button */
    .btn {
      display: block;
      width: 100%;
      background: var(--accent); 
      color: white;
      border: none; 
      border-radius: 8px; 
      padding: 12px;
      font-weight: 600; 
      font-size: 14px;
      cursor: pointer; 
      text-align: center;
      text-decoration: none;
      transition: all 0.2s;
      font-family: 'Inter', sans-serif;
    }

    .btn:hover { 
      background: var(--accent-hover);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(47,129,247,0.3);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-secondary {
      background: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: var(--sidebar);
      border-color: var(--border);
      box-shadow: none;
    }

    /* Graph Controls */
    .graph-controls {
      position: absolute;
      bottom: 20px;
      right: 20px;
      display: flex;
      gap: 8px;
      background: var(--sidebar);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.4);
    }

    .control-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-dim);
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      transition: all 0.2s;
      font-family: 'Inter', sans-serif;
      font-weight: 500;
    }

    .control-btn:hover {
      background: var(--sidebar);
      color: var(--text-main);
      border-color: var(--border);
    }

    /* Legend */
    .legend {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: var(--sidebar);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.4);
    }

    .legend-title {
      font-size: 10px;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      margin-bottom: 10px;
      font-weight: 600;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 12px;
    }

    .legend-item:last-child {
      margin-bottom: 0;
    }

    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .legend-dot.target { background: var(--danger); }
    .legend-dot.direct { background: var(--warning); }
    .legend-dot.ripple { background: var(--accent); }

    /* Network Canvas */
    #mynetwork { width: 100%; height: 100%; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--sidebar); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--border); }

    /* Animations */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card, .stat { animation: fadeIn 0.3s ease; }
  </style>
</head>
