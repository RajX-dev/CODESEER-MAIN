services:
  postgres:
    image: postgres:15
    container_name: n3mo-postgres
    environment:
      POSTGRES_DB: n3mo
      POSTGRES_USER: n3mo
      POSTGRES_PASSWORD: n3mo
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n3mo -d n3mo"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

