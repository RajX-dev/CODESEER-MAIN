services:
  postgres:
    image: postgres:15
    container_name: n3mo-postgres
    environment:
      POSTGRES_DB: n3mo
      POSTGRES_USER: n3mo
      POSTGRES_PASSWORD: n3mo
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n3mo -d n3mo"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  indexer:
    build: 
      context: .           # <--- CHANGED: Build from the root now
    container_name: n3mo-indexer
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn n3mo.api_server:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
    ports:
      - "8000:8000"        # <--- VITAL: Keeps the Graph Server accessible!
    volumes:
      - ./n3mo:/app/n3mo:ro  # Maps the local source code
      # This defaults to scanning the current folder (.) unless you set TARGET_CODE_DIR
      - ${TARGET_CODE_DIR:-.}:/app/target_code

  db-init:
    image: postgres:15
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./db:/schema       # Maps the db folder from the root
    environment:
      PGPASSWORD: n3mo
    entrypoint: >
      bash -c "
      echo 'N3MO: Applying database schemas...' &&
      ls -l /schema &&
      psql -h postgres -U n3mo -d n3mo -f /schema/schema.sql &&
      psql -h postgres -U n3mo -d n3mo -f /schema/saas_schema.sql
      "

volumes:
  postgres_data: