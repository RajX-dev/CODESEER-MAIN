name: N3MO Core Engine

on:
  repository_dispatch:
    types: [n3mo-analyze-pr]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout N3MO Codebase
        uses: actions/checkout@v4
        with:
          ref: saas-main
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run N3MO Core Engine Worker
        env:
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TARGET_REPO: ${{ github.event.client_payload.repository }}
          PR_NUMBER: ${{ github.event.client_payload.pr_number }}
          USER_ID: ${{ github.event.client_payload.user_id }}
          INSTALLATION_ID: ${{ github.event.client_payload.installation_id }}
          GITHUB_PAT: ${{ secrets.GH_PAT }}
        run: |
          python -m n3mo.worker
