<svg xmlns="http://www.w3.org/2000/svg" viewBox="160 30 130 130" width="100%" height="100%">
  <defs>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur1" />
      <feGaussianBlur stdDeviation="9" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>
  <style>
    .letter-path {
      fill: none;
      stroke: url(#cyberGrad);
      stroke-width: 14;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: url(#neonGlow);
    }
    .node-dot {
      fill: #ffffff;
      stroke: #f59e0b;
      stroke-width: 4;
    }
  </style>
  <path class="letter-path" d="M 190 140 L 190 50 L 270 140 L 270 50"/>
  <circle class="node-dot" cx="190" cy="140" r="7"/>
  <circle class="node-dot" cx="190" cy="50" r="7"/>
  <circle class="node-dot" cx="270" cy="140" r="7"/>
  <circle class="node-dot" cx="270" cy="50" r="7"/>
</svg>
