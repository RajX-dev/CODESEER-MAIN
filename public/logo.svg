<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" height="100%">
  <defs>
    <linearGradient id="premiumGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <style>
    .bg-rect { fill: transparent; }
    .letter-path {
      fill: none;
      stroke: url(#premiumGrad);
      stroke-width: 6;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: url(#softGlow);
    }
    .sub-text {
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 6px;
      fill: #e2e8f0;
    }
    .node-dot {
      fill: #07080b;
      stroke: url(#premiumGrad);
      stroke-width: 3;
    }
    .network-edge {
      fill: none;
      stroke: #334155;
      stroke-width: 1;
      opacity: 0.6;
    }
  </style>

  <!-- Network Edge -->
  <path class="network-edge" d="M 100 95 L 800 95" />

  <!-- N3MO Letters -->
  <!-- N -->
  <path class="letter-path" d="M 190 140 L 190 50 L 270 140 L 270 50"/>
  <!-- 3 -->
  <path class="letter-path" d="M 310 50 L 380 50 L 380 90 L 340 95 L 380 100 L 380 140 L 310 140"/>
  <!-- M -->
  <path class="letter-path" d="M 420 140 L 420 50 L 460 95 L 500 50 L 500 140"/>
  <!-- O -->
  <path class="letter-path" d="M 555 50 L 595 50 L 610 65 L 610 125 L 595 140 L 555 140 L 540 125 L 540 65 Z"/>

  <!-- Nodes for N -->
  <circle class="node-dot" cx="190" cy="140" r="5"/>
  <circle class="node-dot" cx="190" cy="50" r="5"/>
  <circle class="node-dot" cx="270" cy="140" r="5"/>
  <circle class="node-dot" cx="270" cy="50" r="5"/>

  <text class="sub-text" x="400" y="180" text-anchor="middle">CODE INTELLIGENCE ENGINE</text>
</svg>
